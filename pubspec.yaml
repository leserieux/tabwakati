name: wakati
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  sentry_flutter: ^9.14.0
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  country_code_picker: ^3.3.0
  google_sign_in: ^6.3.0
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  logger: ^2.5.0
  animate_icons: ^2.0.0
  connectivity_plus: ^6.1.4
  provider: ^6.1.4
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0
  qr_flutter: ^4.1.0
  share_plus: ^7.2.1
  auto_size_text: ^3.0.0
  shimmer: ^3.0.0
  collection: ^1.19.1
  fl_chart: ^1.0.0
  flutter_fortune_wheel: ^1.3.2
  http: ^1.5.0
  flutter_riverpod: ^3.0.3
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  
 
 
dev_dependencies:
  sentry_dart_plugin: ^3.2.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    -  assets/
    -  assets/stickers/
    -  assets/coins/

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/wa.png"
  web:
    generate: true
    image_path: "assets/wa.png"
    background_color: "#0E0A12"
    theme_color: "#0E0A12"
sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: wakati-group
