<!DOCTYPE html>
<html>
<head>

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Wakati">

  <!-- Google Sign-In (requis par google_sign_in_web) -->

  <!-- iOS meta tags & icons -->

  <meta name="theme-color" content="#0E0A12">

    html, body { margin: 0; height: 100%; background: #0E0A12; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center;
              justify-content: center; background: #0E0A12; z-index: 10; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; }
  </style>
</head>
<body>
  <!-- Écran de démarrage Wakati (remplace l'écran blanc pendant le chargement) -->
  <div id="splash"><img src="icons/Icon-192.png" alt="Wakati"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
